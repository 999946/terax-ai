name: Build macOS DMG

on:
  # Auto-trigger on a version tag (vX.Y.Z); manual dispatch remains for ad-hoc
  # DMG rebuilds from the "Actions" tab.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            target: aarch64-apple-darwin
          - arch: intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action is the canonical way to publish Tauri releases: it runs
      # `tauri build`, collects the DMG + signed updater artifacts, and merges
      # each matrix job's per-arch entry into one combined latest.json before
      # uploading it to the same GitHub Release (tagName). This replaces the
      # hand-rolled build/stage/merge/release pipeline that expected `tauri
      # build --bundles dmg` to write latest.json — it never does; only the
      # .sig/.app.tar.gz are produced by the CLI, and merging them across
      # architectures is exactly what this action handles for us.
      - name: Build and publish (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep unsigned public builds explicitly ad-hoc signed. This makes
          # arm64 code executable after a user removes browser quarantine.
          APPLE_SIGNING_IDENTITY: "-"
          # Updater artifacts are only generated when a signing key is present.
          # Without these the built-in updater gets a manifest but nothing to
          # verify against.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Terax v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          # Build both the .dmg (manual installs) and the .app bundle (the
          # signed .app.tar.gz the built-in updater installs). tauri-action
          # generates latest.json for us.
          args: --bundles app,dmg --target ${{ matrix.target }}
