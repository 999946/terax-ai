name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            target: aarch64-apple-darwin
          - arch: intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          TERAX_CLI_TARGET: ${{ matrix.target }}
        run: pnpm tauri build --bundles dmg --target ${{ matrix.target }}

      - name: Rename DMG
        shell: bash
        run: |
          dmg=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mv "$dmg" "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Terax-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Upload DMG to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terax-v${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Terax-v${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish DMG release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Read application version
        id: version
        run: echo "version=$(gh api repos/${{ github.repository }}/contents/package.json?ref=${{ github.sha }} --jq '.content' | base64 -d | jq -r .version)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Terax-v${{ steps.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Terax v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*.dmg
          fail_on_unmatched_files: true
